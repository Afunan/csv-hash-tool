<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSV to Hash Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">

        <h2 class="text-center mb-4 text-primary">🔐 Hash Converter</h2>

        <form action="/" method="POST" enctype="multipart/form-data" onsubmit="return validateFile()">

            <div class="mb-3">
                <label class="form-label fw-bold">Upload CSV File</label>
                <input type="file" class="form-control" name="file" id="file" accept=".csv" required>
                <small class="text-muted">Only .csv file allowed</small>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success w-50">Upload & Convert</button>

                <button type="button" class="btn btn-secondary w-50" onclick="window.location.href='/'">
                    Reset 🔄
                </button>
            </div>
        </form>

        {% if success %}
        <div class="alert alert-success mt-4 fw-bold text-center">
            ✅ File converted successfully!
        </div>

        <div class="text-center">
            <a href="/download/{{ download }}" class="btn btn-primary btn-lg">
                ⬇️ Download Hashed CSV
            </a>
        </div>
        {% endif %}
    </div>
    
    <!-- Privacy Policy Section -->
    <div class="mt-4 text-center text-muted small">
        <h6 class="fw-bold">Privacy Policy</h6>
        <p>
           Tool is available for client's one-time CSV processing. After use, service will be removed or paused.
        </p>
    </div>
</div>

<script>
// Validate file type
function validateFile() {
    let fileInput = document.getElementById("file");
    let filePath = fileInput.value;

    if (!filePath.endsWith(".csv")) {
        alert("❌ Only CSV files are allowed.");
        return false;
    }

    return true;
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
